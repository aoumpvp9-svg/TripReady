<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripReady - 여행 준비물 체크리스트</title>
  <meta name="description" content="여행 준비물을 카테고리별로 관리하고 체크할 수 있는 깔끔하고 직관적인 여행 체크리스트 웹앱">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">✈️</div>
          <div>
            <h1 class="brand-title">TripReady</h1>
            <p class="brand-subtitle">설레는 여행, 빠짐없이 완벽하게 준비하세요!</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="reset-all-btn" class="btn btn-outline-danger" title="모든 준비물을 처음 상태로 초기화합니다">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>전체 초기화</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Dashboard / Progress Summary -->
      <section class="dashboard-section" aria-label="준비 현황">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon-wrapper blue">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">전체 준비물</span>
              <span class="stat-value" id="stat-total">0</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon-wrapper green">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">준비 완료</span>
              <span class="stat-value text-success" id="stat-completed">0</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon-wrapper amber">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">남은 준비물</span>
              <span class="stat-value text-warning" id="stat-remaining">0</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon-wrapper indigo">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 20V10"></path>
                <path d="M12 20V4"></path>
                <path d="M6 20v-6"></path>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">준비 진행률</span>
              <span class="stat-value text-primary" id="stat-rate">0%</span>
            </div>
          </div>
        </div>

        <!-- Progress Bar Card -->
        <div class="progress-box">
          <div class="progress-header">
            <div class="progress-title-wrap">
              <span class="progress-title">전체 달성도</span>
              <span class="progress-status-badge" id="progress-badge">준비 시작 전</span>
            </div>
            <span class="progress-percentage" id="progress-percentage-text">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
          </div>
        </div>
      </section>

      <!-- Add Item Form -->
      <section class="add-item-section" aria-label="새 준비물 추가">
        <form id="add-item-form" class="add-item-form">
          <div class="form-row">
            <div class="form-group select-group">
              <label for="item-category" class="sr-only">카테고리 선택</label>
              <select id="item-category" class="form-select" required>
                <option value="clothes">👕 의류</option>
                <option value="toiletries">🧴 세면도구</option>
                <option value="electronics">📱 전자기기</option>
                <option value="essentials">🪪 여행 필수품</option>
                <option value="medicine">💊 의약품</option>
                <option value="etc">🎒 기타</option>
              </select>
            </div>
            <div class="form-group input-group">
              <label for="item-name" class="sr-only">준비물 이름</label>
              <input 
                type="text" 
                id="item-name" 
                class="form-input" 
                placeholder="추가할 준비물을 입력하세요 (예: 선글라스, 보조배터리)" 
                maxlength="50" 
                autocomplete="off"
                required
              >
            </div>
            <button type="submit" id="add-btn" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>추가하기</span>
            </button>
          </div>
          <p id="form-error" class="form-error" style="display: none;"></p>
        </form>
      </section>

      <!-- Category Filter Tabs -->
      <section class="filter-section" aria-label="카테고리 필터">
        <div class="filter-tabs-container">
          <div class="filter-tabs" id="filter-tabs" role="tablist">
            <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
              전체 보기 <span class="tab-badge" id="tab-badge-all">0</span>
            </button>
            <button class="filter-tab" data-filter="clothes" role="tab" aria-selected="false">
              👕 의류 <span class="tab-badge" id="tab-badge-clothes">0</span>
            </button>
            <button class="filter-tab" data-filter="toiletries" role="tab" aria-selected="false">
              🧴 세면도구 <span class="tab-badge" id="tab-badge-toiletries">0</span>
            </button>
            <button class="filter-tab" data-filter="electronics" role="tab" aria-selected="false">
              📱 전자기기 <span class="tab-badge" id="tab-badge-electronics">0</span>
            </button>
            <button class="filter-tab" data-filter="essentials" role="tab" aria-selected="false">
              🪪 여행 필수품 <span class="tab-badge" id="tab-badge-essentials">0</span>
            </button>
            <button class="filter-tab" data-filter="medicine" role="tab" aria-selected="false">
              💊 의약품 <span class="tab-badge" id="tab-badge-medicine">0</span>
            </button>
            <button class="filter-tab" data-filter="etc" role="tab" aria-selected="false">
              🎒 기타 <span class="tab-badge" id="tab-badge-etc">0</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Category Cards Grid -->
      <section class="checklist-section" aria-label="준비물 목록">
        <div class="category-grid" id="category-grid">
          <!-- Dynamic category cards rendered by app.js -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© TripReady. 모든 데이터는 브라우저에 안전하게 자동 저장됩니다.</p>
    </footer>
  </div>

  <!-- Confirmation Modal for Reset -->
  <div id="reset-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 id="modal-title" class="modal-title">전체 준비물을 초기화할까요?</h3>
      <p class="modal-desc">
        추가된 항목과 체크 상태가 모두 삭제되고, <strong>초기 기본 6개 카테고리 준비물 목록</strong>으로 복원됩니다. 이 작업은 되돌릴 수 없습니다.
      </p>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn btn-secondary">취소</button>
        <button id="modal-confirm-btn" class="btn btn-danger">초기화 진행</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
